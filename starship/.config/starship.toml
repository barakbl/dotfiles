# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true


continuation_prompt = '[>>](bold green)'

format = "$directory$python$custom$git_branch$git_status$cmd_duration$line_break$character"

# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
success_symbol = '[>](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[lua]
disabled = true

[custom.extend]
command = "cat ~/.cache/starship_extend 2>/dev/null"
when = "true"
format = "$output "

[git_status]
# Hide all file-state indicators; keep only ahead/behind/diverged.
modified = ""
untracked = ""
staged = ""
deleted = ""
stashed = ""
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
format = '([$ahead_behind]($style))'
style = "yellow"
