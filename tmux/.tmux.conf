# ─── Prefix ───────────────────────────────────────────────────────────────────

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── General ──────────────────────────────────────────────────────────────────

set  -g mouse on
set  -g base-index 1
set  -g renumber-windows on
set  -g allow-rename off
set  -g default-terminal "tmux-256color"
set  -g status-position top
setw -g pane-base-index 1
setw -g mode-keys vi
setw -g xterm-keys on

# ─── Display ──────────────────────────────────────────────────────────────────

set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 4

# dim inactive panes
setw -g window-style        fg=white,bg=colour236
setw -g window-active-style fg=white,bg=colour235

# ─── Bell ─────────────────────────────────────────────────────────────────────

set  -g visual-activity off
set  -g visual-bell off
set  -g visual-silence off
set  -g bell-action none
setw -g monitor-activity off

# ─── Key Bindings ─────────────────────────────────────────────────────────────

# reload config / cheatsheet / lazygit
bind r source-file ~/.tmux.conf
bind ? display-popup -E -h 80% -w 60% "less ~/.tmux-cheatsheet"
bind g display-popup -w 90% -h 90% -E -d '#{pane_current_path}' lazygit

# pane navigation (no prefix)
bind -n M-h     select-pane -L
bind -n M-l     select-pane -R
bind -n M-k     select-pane -U
bind -n M-m     select-pane -D
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# pane splitting (no prefix)
bind -n M-r split-window -h
bind -n M-d split-window -v

# pane resize
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# pane close (no prefix)
bind -n M-q kill-pane

# windows (no prefix)
bind -n M-t new-window
bind -n M-, command-prompt -I "#W" "rename-window '%%'"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ─── Theme (Catppuccin) ───────────────────────────────────────────────────────

set -g @catppuccin_flavor              "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_date_time_text      "%H:%M"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-left         ""
set -g status-right        "#{E:@catppuccin_status_session}#{E:@catppuccin_status_date_time}"
set -g status-right-length 100

# ─── Plugins ──────────────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'laktak/extrakto'
set -g @extrakto_grab_area    "window"        # only visible pane, not full scrollback
set -g @extrakto_filter_order "url path word" # prefer urls/paths over raw words

TMUX_FZF_LAUNCH_KEY="z"

run '~/.config/tmux/plugins/tpm/tpm'
